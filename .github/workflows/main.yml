name: Joomla Extension Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # ✅ Required to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install uglify-js
      run: npm install -g uglify-js

    - name: Build and Package
      run: |
        VERSION="${{ github.event.inputs.version }}"
        [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
        python build.py "$VERSION"
        echo "ZIP_NAME=mod_eventchart.zip" >> $GITHUB_ENV

    - name: Create GitHub Pre-Release
      run: gh release create "${GITHUB_REF_NAME:-v${{ github.event.inputs.version }}}" --prerelease --generate-notes "${{ env.ZIP_NAME }}" eventchart_update.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

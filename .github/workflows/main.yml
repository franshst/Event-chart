name: Joomla Extension Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # ✅ Required to create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install uglify-js
      run: npm install -g uglify-js

    - name: Build and Package
      run: |
        VERSION="${{ github.event.inputs.version }}"
        [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
        VERSION="${VERSION#v}"
        python build.py "$VERSION"
        echo "TAG=v${VERSION}" >> $GITHUB_ENV

    - name: Release notes
      run: |
        LAST=$(gh release list --limit 2 --json tagName --jq '.[0].tagName' || true)
        if [ "$LAST" = "$TAG" ]; then
          LAST=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' || true)
        fi
        git fetch --tags --quiet
        if [ -n "$LAST" ]; then
          git log "$LAST..HEAD" --pretty=format:'- %s' > release-notes.md
        else
          git log HEAD --pretty=format:'- %s' > release-notes.md
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Pre-Release
      run: gh release create "$TAG" --title "$TAG" --prerelease --notes-file release-notes.md mod_eventchart.zip eventchart_update.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
